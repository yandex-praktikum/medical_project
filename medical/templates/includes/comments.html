{% load user_filters %}

{% for item in items %}
    <div class="col">
        <div class="card" >
            <div class="card-body">
                <h5 class="card-title">{{ item.author_name }}</h5>
                <p class="card-text">{{ item.text }}</p>
                <h6 class="card-subtitle mb-2 text-muted">{{ item.created_at_strftime }}</h6>
            </div>
        </div>
    </div>
{% endfor %}


{% if schedule.is_complete %}
    <a  href="{% url 'add_comment' doctor_id=doctor.id %}">Оставить отзыв</a>
{% endif %}
